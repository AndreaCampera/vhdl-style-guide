name: lm
# The name must be a single word
rule:
  global:
    indent_ize: 2
  constant_004: # names
    case: upper
  constant_015: # prefix
    disable: false
    #prefixes: ["C_"]
    suffixes: ["_C"]
  generic_007: # names
    case: upper
  generic_020: # prefix "G_"
    disable: false
  generic_map_002: # generic names
    case: upper
  instantiation_034: # allow entity instantiation
     method: "entity"
  length_001:
    length: 180
  port_010: # names
    case: lower
  port_011: # prefix
    disable: false
    prefixes: ["i", "o"]
  port_map_002: # port names
    case: lower
  process_029: # allow rising_edge
    disable: true
  signal_007: # default initialization
    disable: true
  subtype_004: # prefix
    disable: false
  type_015: # prefix
    disable: false